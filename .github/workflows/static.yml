# Deploy static content to GitHub Pages
# Trang live: https://khanhlx6.github.io/flipbook-mini-historias/
# Yêu cầu: Settings -> Pages -> Source = "GitHub Actions" (đã bật cho fork này).
# Workflow này chạy khi push lên nhánh `main` (nhánh mặc định của fork).
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Đảm bảo file gốc ở thư mục gốc và tắt Jekyll (tránh lỗi với file bắt đầu bằng _)
      - name: Prepare site (add .nojekyll, verify index.html)
        run: |
          touch .nojekyll
          if [ ! -f index.html ]; then
            echo "::error::Không tìm thấy index.html ở thư mục gốc"
            exit 1
          fi
          echo "index.html OK — sẽ deploy lên https://khanhlx6.github.io/flipbook-mini-historias/"
          ls -lh index.html index.vi.html README.md README.vi.md 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository (index.html + index.vi.html + assets)
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
